<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F8FC">
<title>EOS Kiss Digital N 撮影設定ガイド</title>
<meta name="description" content="EOS Kiss Digital N の M・Av・Tv・ISO の撮影設定を、3Dモデルと手順で確認できるガイド">
<style>
:root{
  --paper:#FFFFFF;
  --header:#F5F8FC;
  --ink:#1F2935;
  --muted:#455569;
  --line:#C3D2E4;
  --model:#F3F7FC;
  --brand:#2358A5;
  --brand-hover:#1B4886;
  --heading:#153762;
  --selection:#DEEAF9;
  --readout:#F2ECDB;
  --readout-ink:#403A2E;
  --inverse:#FFFFFF;
  --marker:#C64A35;
  --marker-ink:#FFFFFF;
  --stage:linear-gradient(125deg,#EDF4FC,#DDEAF9);
  --stage-ink:#455569;
  --page-background:linear-gradient(125deg,#F8FBFF,#E8F1FC);
  --page-pad:clamp(14px,5vw,21px);
  --gap:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  color:var(--ink);
  background:#EEF4FC var(--page-background) fixed;
}
h1,h2,p,figure{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.kc-shell{margin:0 auto;max-width:520px;min-height:100vh;min-height:100dvh;background:var(--page-background);padding-bottom:env(safe-area-inset-bottom)}
.kc-header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:6px var(--page-pad);padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--header) 85%,transparent)}
.kc-wordmark{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.035em;white-space:nowrap}
.kc-dot{width:9px;height:9px;border-radius:50%;background:var(--marker)}
.kc-back{display:flex;align-items:center;gap:7px;padding:0;min-height:44px;border:0;background:transparent;font-size:13px;font-weight:700;white-space:nowrap}
.kc-back .icon{width:16px;height:16px}
.kc-main{padding:20px var(--page-pad) 21px}
.kc-page-title{font-size:30px;letter-spacing:-.055em;line-height:1.16;font-weight:750;color:var(--heading);margin-bottom:17px}

/* ---------- home ---------- */
.kc-home-grid{display:grid;gap:var(--gap);align-items:start}
.kc-choices{min-width:0}
.kc-choices h2{font-size:17px;line-height:1.45;color:var(--heading);margin:0 0 13px}
.kc-list{border-top:1px solid var(--line)}
.kc-row{display:grid;grid-template-columns:36px minmax(0,1fr) 30px 14px;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:56px;font-size:15px;font-weight:650;line-height:1.45}
.kc-row:hover{color:var(--brand);background:var(--selection)}
.kc-purpose-icon,.kc-step-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--selection);color:var(--brand)}
.kc-purpose-icon .icon,.kc-step-icon .icon{width:20px;height:20px;stroke-width:1.65}
.kc-row-chevron{display:grid;place-items:center;color:var(--brand)}
.kc-row-chevron .icon{width:14px;height:14px}
.kc-code{display:inline-grid;place-items:center;white-space:nowrap;font:700 12px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;color:var(--brand)}

/* ---------- 3D model ---------- */
.kc-model{min-width:0;background:var(--model);border-radius:13px;overflow:hidden}
.kc-model-stage{position:relative;padding-top:17px;background:var(--stage)}
.kc-model canvas{display:block;width:100%;height:clamp(138px,44vw,170px);cursor:grab;touch-action:pan-y;color:var(--marker);border-color:var(--marker-ink);outline-offset:-3px}
.kc-model canvas:active{cursor:grabbing}
[data-guide] .kc-model canvas{height:clamp(172px,49vw,198px)}
.kc-model-cue{position:absolute;inset:10px 12px auto;display:flex;justify-content:space-between;gap:4px;color:var(--stage-ink);font-size:11px;pointer-events:none}
.kc-swipe{display:flex;align-items:center;gap:5px}
.kc-swipe .icon{width:13px;height:13px}
.kc-model figcaption{padding:4px 8px 7px}
.kc-parts{display:flex;flex-wrap:wrap;gap:8px 13px;margin:0;padding:3px 1px 9px;list-style:none;color:var(--ink)}
.kc-parts li{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.kc-parts span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--marker);color:var(--marker-ink);font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace}
.kc-model-tools{display:flex;gap:4px;flex-wrap:wrap;justify-content:space-evenly}
.kc-model-tools button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.15;min-height:44px;min-width:44px;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;font-size:12px;color:var(--muted)}
.kc-model-tools button .icon{width:17px;height:17px;stroke-width:1.6}
.kc-model-tools button:hover{color:var(--brand)}
.kc-model-tools button[aria-pressed="true"]{background:var(--selection);border-color:var(--line);color:var(--brand);font-weight:700}

/* ---------- guide ---------- */
.kc-guide-meta{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kc-intro{display:flex;align-items:center;min-width:0;gap:9px}
.kc-intro .kc-code{padding:5px 7px;border-radius:5px;min-width:30px;background:var(--selection)}
.kc-intro h1{font-size:15px;line-height:1.35;letter-spacing:0;font-weight:650;color:var(--muted)}
.kc-count{flex:none;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);white-space:nowrap}
.kc-progress{display:flex;gap:4px;margin:10px 0 17px}
.kc-progress span{flex:1;height:3px;border-radius:3px;background:var(--line);transition:background .2s}
.kc-progress [data-done]{background:var(--brand)}
.kc-guide-grid{display:grid;gap:14px;align-items:start;margin:0;grid-template-areas:"instr" "visual" "check" "nav" "help"}
.kc-instruction{grid-area:instr;min-width:0}
.kc-guide-visual{grid-area:visual;min-width:0}
.kc-check{grid-area:check;min-width:0}
.kc-step-nav{grid-area:nav}
.kc-help{grid-area:help}
.kc-step-heading{display:flex;align-items:center;gap:9px}
.kc-step-icon{flex:none}
.kc-instruction h2{font-size:24px;letter-spacing:-.035em;line-height:1.29;font-weight:750;color:var(--heading)}
.kc-instruction p{margin-top:6px;font-size:16px;line-height:1.62}
.kc-check:has([data-readout][hidden]){display:none}
.kc-readout{padding:11px 12px 13px;border-radius:6px;background:var(--readout);color:var(--readout-ink)}
.kc-readout figcaption{font-size:12px;color:var(--readout-ink)}
.kc-readout>div{margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere;font:650 clamp(17px,5vw,22px)/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--readout-ink)}
.kc-step-nav{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:-2px}
.kc-step-nav button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;padding:0 15px;border:0;border-radius:7px;white-space:nowrap;font-size:14px;font-weight:700}
.kc-step-nav button .icon{width:16px;height:16px}
.kc-prev{background:transparent}
.kc-prev:hover{background:var(--selection)}
.kc-step-nav:has([data-prev]:disabled){grid-template-columns:1fr}
.kc-step-nav [data-prev]:disabled{display:none}
.kc-next{background:var(--brand);color:var(--inverse)}
.kc-next:hover{background:var(--brand-hover)}
.kc-help{margin-top:-7px}
.kc-help summary{display:flex;align-items:center;min-height:44px;padding:12px 1px;color:var(--muted);font-size:13px;font-weight:650;cursor:pointer;list-style:none}
.kc-help summary::-webkit-details-marker{display:none}
.kc-help summary::before{content:"";width:0;height:0;margin-right:7px;border-style:solid;border-width:4.5px 0 4.5px 6px;border-color:transparent transparent transparent currentColor;transition:transform .15s}
.kc-help[open] summary::before{transform:rotate(90deg)}
.kc-help summary .icon{width:14px;height:14px;margin-inline:0 6px;color:var(--brand)}
.kc-help p{margin:0 0 8px;font-size:14px;line-height:1.6}

/* ---------- small phones ---------- */
@media (max-width:359px){
  .kc-page-title{font-size:27px}
  .kc-wordmark{font-size:11px;gap:7px}
  .kc-row{font-size:14px;grid-template-columns:34px minmax(0,1fr) 28px 12px;gap:7px}
  .kc-instruction h2{font-size:22px}
}

/* ---------- tablet+ : framed card ---------- */
@media (min-width:600px){
  body{padding:24px 16px}
  .kc-shell{min-height:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .kc-header{padding-top:6px}
}

/* ---------- PC: two columns ---------- */
@media (min-width:960px){
  :root{--page-pad:clamp(28px,3.4vw,44px);--gap:clamp(28px,3.4vw,44px)}
  body{padding:32px 24px}
  .kc-shell{max-width:1200px}
  .kc-header{min-height:62px}
  .kc-wordmark{font-size:14px}
  .kc-back{font-size:14px}
  .kc-main{padding:34px var(--page-pad) 40px}
  .kc-page-title{font-size:40px;margin-bottom:26px}

  .kc-home-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
  .kc-choices h2{font-size:19px;margin-bottom:14px}
  .kc-row{grid-template-columns:44px minmax(0,1fr) 40px 16px;gap:12px;min-height:76px;padding:16px 12px 16px 6px;font-size:17px;border-radius:0}
  .kc-row .kc-purpose-icon{width:42px;height:42px;border-radius:10px}
  .kc-row .kc-purpose-icon .icon{width:23px;height:23px}
  .kc-row .kc-code{font-size:14px}
  .kc-row-chevron .icon{width:16px;height:16px}
  .kc-model canvas,[data-guide] .kc-model canvas{height:clamp(340px,36vw,440px)}
  .kc-model-stage{padding-top:22px}
  .kc-model-cue{inset:14px 18px auto;font-size:12.5px}
  .kc-swipe .icon{width:15px;height:15px}
  .kc-model figcaption{padding:8px 14px 12px}
  .kc-parts{gap:8px 20px;padding:4px 4px 10px}
  .kc-parts li{font-size:14.5px}
  .kc-parts span{width:22px;height:22px;font-size:12px}
  .kc-model-tools{justify-content:center;gap:8px}
  .kc-model-tools button{flex-direction:row;gap:7px;min-height:44px;padding:0 14px;font-size:13.5px}

  .kc-guide-meta{gap:20px}
  .kc-intro .kc-code{font-size:14px;padding:6px 9px}
  .kc-intro h1{font-size:17px}
  .kc-count{font-size:14px}
  .kc-progress{margin:14px 0 30px;gap:6px}
  .kc-progress span{height:4px}
  .kc-guide-grid{
    grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);
    grid-template-areas:"visual instr" "visual check" "visual nav" "visual help";
    grid-template-rows:auto auto auto 1fr;
    column-gap:var(--gap);row-gap:22px;
  }
  .kc-guide-visual{position:sticky;top:24px}
  .kc-step-icon{width:42px;height:42px;border-radius:10px}
  .kc-step-icon .icon{width:23px;height:23px}
  .kc-instruction h2{font-size:32px}
  .kc-instruction p{margin-top:12px;font-size:17px;line-height:1.75}
  .kc-readout{padding:16px 18px 18px;border-radius:8px}
  .kc-readout figcaption{font-size:13px}
  .kc-readout>div{font-size:26px;margin-top:6px}
  .kc-step-nav{gap:12px;padding-top:20px;margin-top:4px}
  .kc-step-nav button{min-height:54px;font-size:15px;padding:0 20px}
  .kc-help{margin-top:-10px}
  .kc-help summary{font-size:14px}
  .kc-help p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="kc-shell" id="kiss">
  <section data-home>
    <header class="kc-header">
      <span class="kc-wordmark"><span class="kc-dot" aria-hidden="true"></span>EOS Kiss Digital N</span>
    </header>
    <main class="kc-main">
      <h1 class="kc-page-title">撮影設定ガイド</h1>
      <div class="kc-home-grid">
        <div data-model-home>
          <figure class="kc-model" aria-label="EOS Kiss Digital Nの簡略3Dモデル">
            <div class="kc-model-stage">
              <canvas role="img" tabindex="0" aria-label="カメラの簡略3Dモデル。スワイプ、ドラッグ、または矢印キーで回せます"></canvas>
              <div class="kc-model-cue" aria-hidden="true"><span>簡略3Dモデル</span><span class="kc-swipe"><svg class="icon"><use href="#i-move-horizontal"/></svg><span data-swipe-label>スワイプで回転</span></span></div>
            </div>
            <figcaption>
              <ul class="kc-parts" data-parts aria-label="この手順で見る場所" hidden></ul>
              <div class="kc-model-tools" role="group" aria-label="カメラを見る向き">
                <button type="button" data-view="front"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span>正面</span></button>
                <button type="button" data-view="top"><svg class="icon" aria-hidden="true"><use href="#i-panel-top"/></svg><span>上面</span></button>
                <button type="button" data-view="rear"><svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg><span>背面</span></button>
                <button type="button" data-view="step" hidden><svg class="icon" aria-hidden="true"><use href="#i-rotate-ccw"/></svg><span>手順の角度</span></button>
              </div>
            </figcaption>
          </figure>
        </div>
        <section class="kc-choices" aria-labelledby="kc-choices-title">
          <h2 id="kc-choices-title">撮りたいことから探す</h2>
          <div class="kc-list">
            <button class="kc-row" data-open="m" type="button">
              <span class="kc-purpose-icon"><svg class="icon" aria-hidden="true"><use href="#i-sliders-horizontal"/></svg></span><span>自分で露出を決めたい</span><span class="kc-code">M</span><span class="kc-row-chevron"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></span>
            </button>
            <button class="kc-row" data-open="av" type="button">
              <span class="kc-purpose-icon"><svg class="icon" aria-hidden="true"><use href="#i-aperture"/></svg></span><span>背景をぼかしたい</span><span class="kc-code">Av</span><span class="kc-row-chevron"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></span>
            </button>
            <button class="kc-row" data-open="tv" type="button">
              <span class="kc-purpose-icon"><svg class="icon" aria-hidden="true"><use href="#i-timer"/></svg></span><span>動きを止めたい</span><span class="kc-code">Tv</span><span class="kc-row-chevron"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></span>
            </button>
            <button class="kc-row" data-open="iso" type="button">
              <span class="kc-purpose-icon"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></span><span>暗い場所で手ブレを減らしたい</span><span class="kc-code">ISO</span><span class="kc-row-chevron"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></span>
            </button>
          </div>
        </section>
      </div>
    </main>
  </section>

  <section data-guide hidden>
    <header class="kc-header">
      <button class="kc-back" type="button"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg><span>ガイド一覧</span></button>
      <span class="kc-wordmark">EOS Kiss Digital N</span>
    </header>
    <main class="kc-main">
      <div class="kc-guide-meta">
        <div class="kc-intro"><span class="kc-code" data-mode></span><h1 data-title></h1></div>
        <span class="kc-count" data-progress></span>
      </div>
      <div class="kc-progress" aria-hidden="true" data-progress-track></div>

      <article class="kc-guide-grid">
        <div class="kc-instruction" aria-live="polite" aria-atomic="true">
          <div class="kc-step-heading">
            <span class="kc-step-icon" aria-hidden="true"><svg class="icon"><use data-glyph href="#i-circle-dot"/></svg></span>
            <h2 data-step></h2>
          </div>
          <p data-action></p>
        </div>
        <div class="kc-guide-visual" data-model-guide></div>
        <div class="kc-check">
          <figure class="kc-readout" data-readout hidden>
            <figcaption data-caption></figcaption>
            <div data-display></div>
          </figure>
        </div>
        <nav class="kc-step-nav" aria-label="手順">
          <button class="kc-prev" type="button" data-prev><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg><span>前へ</span></button>
          <button class="kc-next" type="button" data-next><span data-next-label>次の手順</span><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        </nav>
        <details class="kc-help">
          <summary><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span data-help-label></span></summary>
          <p data-help></p>
        </details>
      </article>
    </main>
  </section>
</div>

<script>
(function () {
'use strict'
const root = document.getElementById('kiss')
const home = root.querySelector('[data-home]')
const guide = root.querySelector('[data-guide]')
const prev = root.querySelector('[data-prev]')
const next = root.querySelector('[data-next]')
const backButton = root.querySelector('.kc-back')

function difference(a, b) { return a.map((value, axis) => value - b[axis]) }
function dot(a, b) { return a.reduce((sum, value, axis) => sum + value * b[axis], 0) }
function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
}
function face(points, center, color) {
  const outward = cross(difference(points[1], points[0]), difference(points[2], points[0]))
  const length = Math.hypot(...outward)
  const sign = dot(outward, difference(points[0], center)) < 0 ? -1 : 1
  faces.push({ points, normal: outward.map(value => sign * value / length), color })
}
function solid(front, back, color) {
  const vertices = [...front, ...back]
  const center = [0, 1, 2].map(axis => vertices.reduce((sum, point) => sum + point[axis], 0) / vertices.length)
  face(front, center, color)
  face(back, center, color)
  front.forEach((point, i) => {
    const n = (i + 1) % front.length
    face([point, front[n], back[n], back[i]], center, color)
  })
}
function shell(x, y, width, height, front, back, bevel, color) {
  const ring = [
    [x + bevel, y], [x + width - bevel, y], [x + width, y + bevel], [x + width, y + height - bevel],
    [x + width - bevel, y + height], [x + bevel, y + height], [x, y + height - bevel], [x, y + bevel]
  ]
  solid(ring.map(p => [...p, front]), ring.map(p => [...p, back]), color)
}
function cylinder(x, y, z, end, radius, endRadius, axis, color, segments = 24) {
  function ring(depth, size) {
    return Array.from({ length: segments }, (_, i) => {
      const angle = i * Math.PI * 2 / segments
      const dx = Math.cos(angle) * size
      const dy = Math.sin(angle) * size
      return axis === 'y' ? [x + dx, depth, z + dy] : [x + dx, y + dy, depth]
    })
  }
  solid(ring(axis === 'y' ? y : z, radius), ring(end, endRadius), color)
}
function mark(value, position, normal, color = '#e6eadf', size = 9) {
  markings.push({ value, position, normal, color, size })
}

// Gentle idle sway: a few degrees of slow drift, paused while dragging.
const sway = { yaw: 0, pitch: 0, amount: 0, holdUntil: 0 }

const markerState = { visible: [] }

function paintModel() {
  if (!ctx) return
  const width = canvas.clientWidth
  const height = canvas.clientHeight
  if (!width || !height) return
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2)
  const pixelWidth = Math.round(width * pixelRatio)
  const pixelHeight = Math.round(height * pixelRatio)
  if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
    canvas.width = pixelWidth
    canvas.height = pixelHeight
  }
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0)
  ctx.clearRect(0, 0, width, height)
  // The idle sway is added on top of the chosen angle, so view state stays exact.
  const sy = Math.sin(yaw + sway.yaw)
  const cy = Math.cos(yaw + sway.yaw)
  const sp = Math.sin(pitch + sway.pitch)
  const cp = Math.cos(pitch + sway.pitch)
  const style = getComputedStyle(canvas)
  const accent = style.color
  const inverse = style.borderTopColor
  function rotate([x, y, z]) {
    const depth = -sy * x + cy * z
    return [cy * x + sy * z, cp * y - sp * depth, sp * y + cp * depth]
  }
  // Shift the whole model to center the combined body and lens.
  function world(point) { return rotate([point[0], point[1], point[2] + 16]) }
  function perspective([x, y, z]) {
    const factor = 285 / (285 - z)
    return [x * factor, y * factor]
  }
  const outline = vertices.map(point => perspective(world(point)))
  let left = Infinity, right = -Infinity, bottom = Infinity, top = -Infinity
  for (const [x, y] of outline) {
    if (x < left) left = x
    if (x > right) right = x
    if (y < bottom) bottom = y
    if (y > top) top = y
  }
  const pad = width > 600 ? 60 : 36
  const scale = Math.min(width / 171, height / 118, (width - pad) / (right - left), (height - pad) / (top - bottom))
  const centerX = width / 2 - (left + right) * scale / 2
  const centerY = height / 2 + 4 + (top + bottom) * scale / 2
  function project(point) {
    const [x, y] = perspective(point)
    return [centerX + x * scale, centerY - y * scale]
  }
  const layers = []
  faces.forEach(surface => {
    const normal = rotate(surface.normal)
    if (normal[2] <= .014) return
    const points = surface.points.map(world)
    const depth = points.reduce((total, point) => total + point[2], 0) / points.length
    layers.push({ depth, points, light: normal[1] * .65 - normal[0] * .2 + normal[2] * .34, color: surface.color })
  })
  markings.forEach(label => {
    if (rotate(label.normal)[2] < .25) return
    const point = world(label.position)
    layers.push({ depth: point[2] + .2, point, label })
  })
  layers.sort((a, b) => a.depth - b.depth)
  // Labels keep the comp's size on phones and grow with the model on PC.
  const labelScale = scale < 1.4 ? Math.min(1.2, scale) : scale * .86
  for (const layer of layers) {
    if (layer.label) {
      const { value, size, color } = layer.label
      const [x, y] = project(layer.point)
      ctx.fillStyle = color
      ctx.font = `600 ${size * labelScale}px ui-monospace, Menlo, monospace`
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText(value, x, y)
      continue
    }
    const brightness = 0.77 + .43 * Math.max(0, layer.light)
    const rgb = layer.color.slice(1).match(/../g).map(hex => Math.round(parseInt(hex, 16) * brightness))
    ctx.beginPath()
    layer.points.forEach((point, i) => {
      const [x, y] = project(point)
      if (i) ctx.lineTo(x, y)
      else ctx.moveTo(x, y)
    })
    ctx.closePath()
    ctx.fillStyle = `rgb(${rgb.join(',')})`
    ctx.strokeStyle = ctx.fillStyle
    ctx.lineWidth = .7
    ctx.fill()
    ctx.stroke()
  }
  // Orange-red operation markers, numbered in the order of the parts list.
  const k = width > 600 ? 1.45 : 1
  markerState.visible = []
  if (activePose) activePose.parts.forEach((name, i) => {
    const [, position, normal] = parts[name]
    if (rotate(normal)[2] < .18) return
    const [x, y] = project(world(position))
    const offset = (['av', 'panel', 'play'].includes(name) ? -18 : 18) * k
    const badgeX = Math.max(12 * k, Math.min(width - 12 * k, x + offset))
    const badgeY = Math.max(18 * k, Math.min(height - 12 * k, y + (name === 'av' ? 14 : -15) * k))
    markerState.visible.push({ name, number: i + 1, x: Math.round(badgeX), y: Math.round(badgeY) })
    ctx.beginPath()
    ctx.arc(x, y, 6 * k, 0, Math.PI * 2)
    ctx.moveTo(x + Math.sign(offset) * 5 * k, y)
    ctx.lineTo(badgeX, badgeY)
    ctx.strokeStyle = inverse
    ctx.lineWidth = 3.5 * k
    ctx.stroke()
    ctx.strokeStyle = accent
    ctx.lineWidth = 1.7 * k
    ctx.stroke()
    ctx.beginPath()
    ctx.arc(badgeX, badgeY, 8.5 * k, 0, Math.PI * 2)
    ctx.fillStyle = accent
    ctx.strokeStyle = inverse
    ctx.lineWidth = 1.5 * k
    ctx.fill()
    ctx.stroke()
    ctx.fillStyle = inverse
    ctx.font = `700 ${11 * k}px ui-monospace, Menlo, monospace`
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText(String(i + 1), badgeX, badgeY + .3)
  })
}

let paintQueued = false
function requestPaint() {
  if (paintQueued) return
  paintQueued = true
  requestAnimationFrame(() => { paintQueued = false; paintModel() })
}

function setView(view) {
  currentView = view
  if (view) [yaw, pitch] = view === 'step' ? activePose.view : views[view]
  viewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === currentView)))
  paintModel()
}
function showModel(pose) {
  activePose = pose
  partsList.replaceChildren()
  if (pose) pose.parts.forEach((name, i) => {
    const item = document.createElement('li')
    const badge = document.createElement('span')
    badge.textContent = i + 1
    item.append(badge, document.createTextNode(parts[name][0]))
    partsList.append(item)
  })
  partsList.hidden = !pose
  viewButtons.find(button => button.dataset.view === 'step').hidden = !pose
  setView(pose ? 'step' : 'front')
}
viewButtons.forEach(button => button.addEventListener('click', () => setView(button.dataset.view)))

function rotateBy(dYaw, dPitch) {
  yaw += dYaw
  pitch = Math.max(-1.15, Math.min(1.47, pitch + dPitch))
  if (currentView) setView(null)
  else requestPaint()
}
canvas.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY }
  try { canvas.setPointerCapture(event.pointerId) } catch (e) { /* pointer already gone */ }
})
canvas.addEventListener('pointermove', event => {
  if (!drag || drag.id !== event.pointerId) return
  const dx = event.clientX - drag.x
  const dy = event.clientY - drag.y
  drag.x = event.clientX
  drag.y = event.clientY
  rotateBy(dx * .014, dy * .013)
})
function endDrag(event) {
  if (drag && drag.id === event.pointerId) { drag = null; sway.holdUntil = performance.now() + 1200 }
}
canvas.addEventListener('pointerup', endDrag)
canvas.addEventListener('pointercancel', endDrag)
canvas.addEventListener('lostpointercapture', endDrag)
canvas.addEventListener('keydown', event => {
  const step = { ArrowLeft: [-.15, 0], ArrowRight: [.15, 0], ArrowUp: [0, -.12], ArrowDown: [0, .12] }[event.key]
  if (!step) return
  event.preventDefault()
  rotateBy(step[0], step[1])
})

// Idle sway loop: ~30fps, only while the model is on screen and the tab is visible,
// and never when the viewer prefers reduced motion.
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)')
let swayFrame = 0
let lastSwayPaint = 0
let modelOnScreen = true
function swayTick(now) {
  swayFrame = 0
  if (!swayActive()) return
  swayFrame = requestAnimationFrame(swayTick)
  if (now - lastSwayPaint < 33) return
  const dt = Math.min(100, now - (lastSwayPaint || now))
  lastSwayPaint = now
  // Ease the sway out while dragging or just after, and back in when idle.
  const target = drag || keyHeld || now < sway.holdUntil ? 0 : 1
  sway.amount += (target - sway.amount) * Math.min(1, dt / 600)
  const t = now / 1000
  sway.yaw = sway.amount * (Math.sin(t * 2 * Math.PI / 7) * .055 + Math.sin(t * 2 * Math.PI / 3.1) * .012)
  sway.pitch = sway.amount * Math.sin(t * 2 * Math.PI / 5.3 + 1.1) * .022
  paintModel()
}
function swayActive() { return !reduceMotion.matches && !document.hidden && modelOnScreen }
function updateSway() {
  if (swayActive()) { if (!swayFrame) { lastSwayPaint = 0; swayFrame = requestAnimationFrame(swayTick) } }
  else {
    if (swayFrame) cancelAnimationFrame(swayFrame)
    swayFrame = 0
    if (reduceMotion.matches && (sway.yaw || sway.pitch)) { sway.yaw = sway.pitch = sway.amount = 0; requestPaint() }
  }
}
let keyHeld = false
canvas.addEventListener('keydown', () => { keyHeld = true })
canvas.addEventListener('keyup', () => { keyHeld = false; sway.holdUntil = performance.now() + 1200 })
canvas.addEventListener('blur', () => { keyHeld = false })
if (window.IntersectionObserver) {
  new IntersectionObserver(entries => {
    modelOnScreen = entries[entries.length - 1].isIntersecting
    updateSway()
  }).observe(canvas)
}
document.addEventListener('visibilitychange', updateSway)
if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', updateSway)
updateSway()

function render() {
  const steps = topic[2]
  const step = steps[index]
  root.querySelector('[data-readout]').hidden = !step[2]
  root.querySelector('[data-help-label]').textContent = helpLabels[topicKey][index]
  const progress = root.querySelector('[data-progress-track]')
  progress.replaceChildren(...steps.map((_, stepIndex) => {
    const segment = document.createElement('span')
    if (stepIndex <= index) segment.setAttribute('data-done', '')
    return segment
  }))
  ;['step', 'action', 'display', 'caption', 'help'].forEach((key, offset) => {
    root.querySelector('[data-' + key + ']').textContent = step[offset]
  })
  root.querySelector('[data-mode]').textContent = topic[0]
  root.querySelector('[data-title]').textContent = topic[1]
  root.querySelector('[data-progress]').textContent = (index + 1) + ' / ' + steps.length
  root.querySelector('[data-glyph]').setAttribute('href', '#i-' + glyphs[topicKey][index])
  root.querySelector('details').open = false
  showModel(guideViews[topicKey][index])
  prev.disabled = index === 0
  root.querySelector('[data-next-label]').textContent = index === steps.length - 1 ? 'ガイド一覧へ' : '次の手順'
  document.title = topic[0] + '：' + topic[1] + '（' + (index + 1) + '/' + steps.length + '）｜EOS Kiss Digital N'
}

function showHome(focusKey) {
  guide.hidden = true
  home.hidden = false
  root.querySelector('[data-model-home]').append(model)
  showModel(null)
  document.title = 'EOS Kiss Digital N 撮影設定ガイド'
  const opener = focusKey && root.querySelector('[data-open="' + focusKey + '"]')
  if (opener) opener.focus({ preventScroll: true })
  window.scrollTo(0, 0)
}
function showGuide(key) {
  topicKey = key
  topic = topics[key]
  index = 0
  home.hidden = true
  guide.hidden = false
  root.querySelector('[data-model-guide]').append(model)
  render()
  window.scrollTo(0, 0)
  backButton.focus({ preventScroll: true })
}

// Hash routing so the browser / phone back button returns to the list.
function route() {
  const key = location.hash.slice(1)
  if (topics[key]) { if (guide.hidden || topicKey !== key) showGuide(key) }
  else if (!guide.hidden) showHome(topicKey)
}
root.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => {
  const key = button.dataset.open
  try { history.pushState({ guide: key }, '', '#' + key) } catch (e) { /* some file:// contexts */ }
  showGuide(key)
}))
function close() {
  if (history.state && history.state.guide) { history.back(); return }
  try { history.replaceState(null, '', location.pathname + location.search) } catch (e) {}
  showHome(topicKey)
}
backButton.addEventListener('click', close)
window.addEventListener('popstate', route)
window.addEventListener('hashchange', route)

function changeStep(offset) {
  index += offset
  render()
  if (prev.disabled && offset < 0) next.focus({ preventScroll: true })
  root.querySelector('.kc-instruction').scrollIntoView({ block: 'nearest' })
}
prev.addEventListener('click', () => changeStep(-1))
next.addEventListener('click', () => {
  if (index === topic[2].length - 1) { close(); return }
  changeStep(1)
})

route()
window.__kiss = { markerState, sway, get state() { return { topicKey, index, yaw, pitch, currentView } } }
})()
</script>
</body>
</html>
